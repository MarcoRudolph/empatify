<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@900&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 60px;
    padding: 60px 80px;
    font-family: sans-serif;
  }

  .label {
    color: #666;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 16px;
    text-align: center;
  }

  /* ── DARK VARIANT ── */
  .card-dark {
    background: #0F0F0F;
    border-radius: 20px;
    padding: 48px 64px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── LIGHT VARIANT ── */
  .card-light {
    background: #FFFFFF;
    border-radius: 20px;
    padding: 48px 64px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── LOGO MARK ── */
  .logo {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo svg {
    flex-shrink: 0;
    display: block;
  }

  .wordmark {
    font-family: 'Unbounded', sans-serif;
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1;
  }

  /* Sizes */
  .logo.xl svg  { width: 72px; height: 72px; }
  .logo.xl .wordmark { font-size: 56px; }

  .logo.lg svg  { width: 48px; height: 48px; }
  .logo.lg .wordmark { font-size: 38px; }

  .logo.md svg  { width: 32px; height: 32px; }
  .logo.md .wordmark { font-size: 26px; }

  /* Colors */
  .on-dark svg  { color: #FF6B00; }
  .on-dark .wordmark { color: #FFFFFF; }

  .on-light svg  { color: #FF6B00; }
  .on-light .wordmark { color: #0F0F0F; }

  .row {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
</style>
</head>
<body>

  <!-- XL dark — main snip target -->
  <div class="row">
    <div class="label">Dark — XL (snip this)</div>
    <div class="card-dark">
      <div class="logo xl on-dark">
        <svg viewBox="2 1 36 38" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
          <circle cx="20" cy="20" r="9" stroke-opacity="0.9"/>
          <circle cx="20" cy="11" r="9" stroke-opacity="0.65"/>
          <circle cx="27.8" cy="15.5" r="9" stroke-opacity="0.65"/>
          <circle cx="27.8" cy="24.5" r="9" stroke-opacity="0.65"/>
          <circle cx="20" cy="29" r="9" stroke-opacity="0.65"/>
          <circle cx="12.2" cy="24.5" r="9" stroke-opacity="0.65"/>
          <circle cx="12.2" cy="15.5" r="9" stroke-opacity="0.65"/>
        </svg>
        <span class="wordmark">rudolpho-chat</span>
      </div>
    </div>
  </div>

  <!-- XL light -->
  <div class="row">
    <div class="label">Light — XL</div>
    <div class="card-light">
      <div class="logo xl on-light">
        <svg viewBox="2 1 36 38" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
          <circle cx="20" cy="20" r="9" stroke-opacity="0.9"/>
          <circle cx="20" cy="11" r="9" stroke-opacity="0.65"/>
          <circle cx="27.8" cy="15.5" r="9" stroke-opacity="0.65"/>
          <circle cx="27.8" cy="24.5" r="9" stroke-opacity="0.65"/>
          <circle cx="20" cy="29" r="9" stroke-opacity="0.65"/>
          <circle cx="12.2" cy="24.5" r="9" stroke-opacity="0.65"/>
          <circle cx="12.2" cy="15.5" r="9" stroke-opacity="0.65"/>
        </svg>
        <span class="wordmark">rudolpho-chat</span>
      </div>
    </div>
  </div>

  <!-- Size scale — dark -->
  <div class="row">
    <div class="label">Scale reference — Dark</div>
    <div class="card-dark" style="gap: 40px; flex-direction: column;">
      <div class="logo lg on-dark">
        <svg viewBox="2 1 36 38" fill="none" stroke="currentColor" stroke-width="1.4">
          <circle cx="20" cy="20" r="9" stroke-opacity="0.9"/>
          <circle cx="20" cy="11" r="9" stroke-opacity="0.65"/>
          <circle cx="27.8" cy="15.5" r="9" stroke-opacity="0.65"/>
          <circle cx="27.8" cy="24.5" r="9" stroke-opacity="0.65"/>
          <circle cx="20" cy="29" r="9" stroke-opacity="0.65"/>
          <circle cx="12.2" cy="24.5" r="9" stroke-opacity="0.65"/>
          <circle cx="12.2" cy="15.5" r="9" stroke-opacity="0.65"/>
        </svg>
        <span class="wordmark">rudolpho-chat</span>
      </div>
      <div class="logo md on-dark">
        <svg viewBox="2 1 36 38" fill="none" stroke="currentColor" stroke-width="1.4">
          <circle cx="20" cy="20" r="9" stroke-opacity="0.9"/>
          <circle cx="20" cy="11" r="9" stroke-opacity="0.65"/>
          <circle cx="27.8" cy="15.5" r="9" stroke-opacity="0.65"/>
          <circle cx="27.8" cy="24.5" r="9" stroke-opacity="0.65"/>
          <circle cx="20" cy="29" r="9" stroke-opacity="0.65"/>
          <circle cx="12.2" cy="24.5" r="9" stroke-opacity="0.65"/>
          <circle cx="12.2" cy="15.5" r="9" stroke-opacity="0.65"/>
        </svg>
        <span class="wordmark">rudolpho-chat</span>
      </div>
    </div>
  </div>

</body>
</html>
